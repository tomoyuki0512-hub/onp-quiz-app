name: onp_quiz_app
description: 音楽初心者向けの音符あてクイズアプリ（ト音記号・ヘ音記号）
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  audioplayers: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: false

  assets:
    - assets/fonts/OFL.txt

  fonts:
    - family: Bravura
      fonts:
        - asset: assets/fonts/Bravura.otf
