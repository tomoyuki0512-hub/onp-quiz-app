name: Build iOS IPA (Unsigned)

on:
  push:
    branches:
      - main
      - claude/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      # 生成物(プラグイン登録/Pods)を確実に再生成するため一度クリーンする。
      # flutter-action のキャッシュが古い状態を復元して pod install と
      # ずれることで audioplayers_darwin が組み込まれない問題を防ぐ。
      - name: Clean
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      # pub get → プラグイン登録の生成 → pod install → xcodebuild を
      # Flutter が正しい順序で一括実行する。手動でステップを分けると
      # 生成物の順序ずれでプラグインのモジュールが見つからないことがある。
      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Locate built .app
        run: |
          find build/ios -name "Runner.app" -type d 2>/dev/null || true
          ls -la build/ios/ 2>/dev/null || true

      - name: Create unsigned IPA
        run: |
          APP_PATH=$(find build/ios -name "Runner.app" -type d | head -1)
          echo "Using .app at: $APP_PATH"
          OUTDIR=$(dirname "$APP_PATH")
          mkdir -p "$OUTDIR/Payload"
          cp -R "$APP_PATH" "$OUTDIR/Payload/"
          cd "$OUTDIR"
          zip -qq -r -9 onp_quiz_app-unsigned.ipa Payload
          ls -la onp_quiz_app-unsigned.ipa
          echo "IPA_DIR=$OUTDIR" >> $GITHUB_ENV

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: onp_quiz_app-unsigned-ipa
          path: ${{ env.IPA_DIR }}/onp_quiz_app-unsigned.ipa
          retention-days: 30

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: onp_quiz_app-Runner-app
          path: build/ios/**/Runner.app
          retention-days: 7
